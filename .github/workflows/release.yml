name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compile, test & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis ffmpeg nasm pkg-config libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Read version & check tag
        id: meta
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${VERSION}" >&2
            exit 1
          fi

      - name: Run test suite
        run: cargo test

      - name: Build Windows installer
        run: ./tools/build-installer.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Tapas ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            target/installer/Tapas-Setup-${{ steps.meta.outputs.version }}.exe
            target/installer/SHA256SUMS.txt
