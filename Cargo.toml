[package]
name = "tapas"
version = "0.3.0"
edition = "2024"
description = "Tapas: TP-Link Tapo cameras and the H500 HomeBase on Windows, through the Tapo cloud"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
directories = "6.0.0"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
md-5 = "0.11.0"
# rustls with aws-lc-rs, shared with the relay connections (tokio-rustls).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
sha1 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Pinned exactly: app.rs keeps the accent colour through its unstable internal API,
# and main.rs tunes WGPU memory hints via unstable-wgpu-30.
slint = { version = "=1.19.0", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "renderer-femtovg", "renderer-software", "unstable-wgpu-30", "accessibility", "compat-1-2"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
sha2 = "0.11"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "=1.19.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Image decoding is far too slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 2

# Frame copies are generic code compiled into this crate; unoptimised they
# cap video at ~20 fps, which hides how release builds play.
[profile.dev]
opt-level = 1

# Only for building and testing on Linux; the Windows build doesn't need it.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["backend-winit-x11"] }
